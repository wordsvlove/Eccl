        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            let currentDayIndex = 1;

            // Check if current date is October 2026
            if (today.getFullYear() === 2026 && today.getMonth() === 9) { // getMonth is 0-indexed (9 = Oct)
                currentDayIndex = today.getDate();
            }

            // Ensure index is within our bounds
            if (currentDayIndex < 1) currentDayIndex = 1;
            if (currentDayIndex > 31) currentDayIndex = 31;

            renderList();
            displayDay(currentDayIndex);
        });

        function renderList() {
            const listContainer = document.getElementById('day-list');
            listContainer.innerHTML = '';

            for (let i = 1; i <= 31; i++) {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3 rounded-xl mb-1 text-sm transition-all duration-200 border-l-4 ${i === 1 ? 'border-amber-500 bg-stone-800 text-white' : 'border-transparent text-stone-400 hover:bg-stone-800 hover:text-stone-200'}`;
                btn.id = `btn-day-${i}`;
                btn.innerHTML = `<span class="opacity-60 mr-2">10/${i}</span> ${devotionalData[i].title}`;
                btn.onclick = () => displayDay(i);
                listContainer.appendChild(btn);
            }
        }

        let currentUtterance = null;

        function displayDay(day) {
            // Update active state in sidebar
            for (let i = 1; i <= 31; i++) {
                const btn = document.getElementById(`btn-day-${i}`);
                if(btn) {
                    if (i === day) {
                        btn.className = `w-full text-left px-4 py-3 rounded-xl mb-1 text-sm transition-all duration-200 border-l-4 border-amber-500 bg-stone-800 text-white`;
                    } else {
                        btn.className = `w-full text-left px-4 py-3 rounded-xl mb-1 text-sm transition-all duration-200 border-l-4 border-transparent text-stone-400 hover:bg-stone-800 hover:text-stone-200`;
                    }
                }
            }

            const data = devotionalData[day];
            
            // Animation reset
            const contentArea = document.getElementById('content-area');
            contentArea.classList.remove('fade-in');
            void contentArea.offsetWidth; // trigger reflow
            contentArea.classList.add('fade-in');

            // Populate text
            document.getElementById('display-date').textContent = `2026年 10月${day}日`;
            document.getElementById('display-title').textContent = data.title;
            document.getElementById('display-verse').textContent = data.verse;
            document.getElementById('display-ref').textContent = data.ref;
            document.getElementById('display-theology').textContent = data.theology;
            document.getElementById('display-heart').textContent = data.heart;
            document.getElementById('display-action').textContent = data.action;
            document.getElementById('display-question').textContent = data.question;
            document.getElementById('display-prayer').textContent = data.prayer;

            // Stop any ongoing speech when switching days
            if(window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
            document.getElementById('listen-text').textContent = "聆聽內容";

            // Setup Listen Button
            document.getElementById('listen-btn').onclick = () => {
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    document.getElementById('listen-text').textContent = "聆聽內容";
                    return;
                }

                document.getElementById('listen-text').textContent = "停止聆聽";

                // Prepare text, stripping verse refs and formatting
                const fullText = `
                    ${data.title}。
                    ${data.verse}。
                    聖言反思。${data.theology}
                    心靈觀照。${data.heart}
                    生活實踐。${data.action}
                    今日反思問題。${data.question}
                    結束禱告。${data.prayer}
                `;

                // Clean text for speech (Remove brackets and specific symbols as requested)
                let cleanText = fullText
                    .replace(/【.*?】/g, '')
                    .replace(/\[.*?\]/g, '')
                    .replace(/\(.*\)/g, '')
                    // We don't strip normal punctuation because the speech engine needs them for natural pauses.
                    // We just ensure no weird symbols are read out.
                    .replace(/[:：]/g, '。'); 

                currentUtterance = new SpeechSynthesisUtterance(cleanText);
                currentUtterance.lang = 'zh-TW';
                currentUtterance.rate = 0.95; // Slightly slower for devotional tone
                currentUtterance.pitch = 1;

                currentUtterance.onend = () => {
                    document.getElementById('listen-text').textContent = "聆聽內容";
                };

                window.speechSynthesis.speak(currentUtterance);
            };
        }
    </script>
